<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>みんなの掲示板</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>みんなの掲示板</h1>
      <p><a href="/index.html">トップに戻る</a></p>

      <div id="list"></div>
    </div>

    <script>
      async function loadPublicMemos() {
        const res = await fetch("/api/public-memos");
        const memos = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        if (memos.length === 0) {
          list.innerHTML =
            '<p class="empty">まだ公開されたメモはありません。</p>';
          return;
        }

        memos.forEach((memo) => {
          const div = document.createElement("div");
          div.className = "memo-item";
          const date = new Date(memo.createdAt).toLocaleString("ja-JP");
          div.innerHTML = `
          <div class="memo-content">${escapeHtml(memo.content)}</div>
          <div class="memo-meta">投稿者: ${escapeHtml(memo.username)} ・ ${date}</div>
        `;
          list.appendChild(div);
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      loadPublicMemos();
    </script>
  </body>
</html>
