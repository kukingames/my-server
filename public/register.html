<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>新規登録</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>新規登録</h1>
    <form action="/register" method="POST">
      <label>ユーザー名: <input type="text" name="username" required /></label
      ><br />
      <label
        >パスワード: <input type="password" name="password" required /></label
      ><br />
      <button type="submit">登録する</button>
    </form>
  </body>
</html>
