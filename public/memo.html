<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>メモ</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>マイメモ</h1>
      <nav>
        <a href="/mypage.html">マイページに戻る</a>
        <a href="/board.html">みんなの掲示板を見る</a>
      </nav>

      <form onsubmit="return false;">
        <label
          >内容
          <textarea
            id="content"
            rows="3"
            placeholder="メモを書く..."
          ></textarea>
        </label>
        <div class="checkbox-row">
          <input type="checkbox" id="isPublic" />
          <label for="isPublic" style="margin: 0"
            >みんなの掲示板に公開する</label
          >
        </div>
        <button id="submit">投稿する</button>
      </form>

      <div id="list"></div>
    </div>

    <script>
      async function loadMemos() {
        const res = await fetch("/api/memos");
        if (!res.ok) {
          window.location.href = "/login.html";
          return;
        }
        const memos = await res.json();

        const list = document.getElementById("list");
        list.innerHTML = "";

        if (memos.length === 0) {
          list.innerHTML = '<p class="empty">まだメモがありません。</p>';
          return;
        }

        memos.forEach((memo) => {
          const div = document.createElement("div");
          div.className = "memo-item";
          div.innerHTML = `
          <div class="memo-content">${escapeHtml(memo.content)}</div>
          <div class="memo-meta">${memo.isPublic ? "🌐 公開中" : "🔒 非公開"}</div>
          <div class="memo-actions">
            <button class="edit" data-id="${memo._id}">編集</button>
            <button class="delete" data-id="${memo._id}">削除</button>
          </div>
        `;
          list.appendChild(div);
        });

        document.querySelectorAll(".delete").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("本当に削除しますか？")) return;
            await fetch(`/api/memos/${btn.dataset.id}`, { method: "DELETE" });
            loadMemos();
          });
        });

        document.querySelectorAll(".edit").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const newContent = prompt("新しい内容を入力してください:");
            if (newContent === null || newContent.trim() === "") return;

            await fetch(`/api/memos/${btn.dataset.id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: newContent }),
            });
            loadMemos();
          });
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      document.getElementById("submit").addEventListener("click", async () => {
        const content = document.getElementById("content").value;
        const isPublic = document.getElementById("isPublic").checked;
        if (!content.trim()) return;

        await fetch("/api/memos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content, isPublic }),
        });

        document.getElementById("content").value = "";
        document.getElementById("isPublic").checked = false;
        loadMemos();
      });

      loadMemos();
    </script>
  </body>
</html>
