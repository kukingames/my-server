<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>マイページ</title>
    <style>
      img#avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        background: #eee;
      }
    </style>
  </head>
  <body>
    <h1>マイページ</h1>
    <p id="welcome">読み込み中...</p>

    <img id="avatar" src="" alt="プロフィール画像" /><br /><br />
    <input type="file" id="avatarInput" accept="image/*" />
    <button id="uploadBtn">画像を変更</button>

    <p><a href="/memo.html">メモを書く</a></p>
    <a href="/logout">ログアウト</a>

    <script>
      function loadMe() {
        fetch("/api/me")
          .then((res) => {
            if (!res.ok) throw new Error();
            return res.json();
          })
          .then((data) => {
            document.getElementById("welcome").textContent =
              `ようこそ、${data.username}さん!`;
            document.getElementById("avatar").src =
              data.avatar || "https://via.placeholder.com/100?text=No+Image";
          })
          .catch(() => {
            window.location.href = "/login.html";
          });
      }

      document
        .getElementById("uploadBtn")
        .addEventListener("click", async () => {
          const fileInput = document.getElementById("avatarInput");
          if (!fileInput.files[0]) return;

          const formData = new FormData();
          formData.append("avatar", fileInput.files[0]);

          const res = await fetch("/api/avatar", {
            method: "POST",
            body: formData,
          });
          if (res.ok) {
            loadMe();
          } else {
            alert("アップロードに失敗しました");
          }
        });

      loadMe();
    </script>
  </body>
</html>
